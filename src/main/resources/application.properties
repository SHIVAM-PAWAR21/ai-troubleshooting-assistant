spring.application.name=troubleshooter

spring.datasource.url=jdbc:mysql://localhost:3306/ai_troubleshooter?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Local embedding model (downloaded into models/, never committed)
spring.ai.embedding.transformer.onnx.model-uri=file:models/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=file:models/all-MiniLM-L6-v2/tokenizer.json